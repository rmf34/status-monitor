# Generated by setup_cli.py. Edit by hand if you prefer.
settings:
  poll_interval_seconds: 60
  show: per_source                          # per_source = one tray icon per source; worst_of = single combined icon
  indicator_order: [gcp, github, anthropic] # left-to-right order in the tray (per_source mode only)
  notify_on_change: true                    # desktop notification when a source's level changes
  open_on_critical: false                   # open the status page in the browser on critical transitions
  min_level: minor                          # surface issues at or above this level (info|minor|major|critical); info also surfaces scheduled maintenance

projects:
  - name: gcp:k1flow-staging
    type: gcp
    config:
      project_id: k1flow-staging
      services:
        - name: Cloud Run
          regions: ["us-central1"]
        - name: Google Cloud SQL
          regions: ["us-central1"]
        - name: Google Cloud DNS
        - name: Google Cloud Storage
          regions: ["us-east1"]

  - name: github:rmf34/k1flow
    type: github
    config:
      repo: rmf34/k1flow
      components:
        - Git Operations
        - Pull Requests
        - Actions

  - name: anthropic
    type: anthropic
    config:
      components:
        - Claude API (api.anthropic.com)
        - Claude Code
